<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Видео плеер</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section class="video">

    <video id="video" autoplay muted loop playsinline>
      <source src="video/video1.mp4" type="video/mp4">
    </video>

    <div class="video__content">
      <div class="container">

        <h1 id="video-title">Название видео 1</h1>
        <p id="video-author">Автор 1</p>

        <div class="video__buttons">
          <button id="prev" onclick="prevVideo()">
            Назад
          </button>

          <button id="play" onclick="playVideo()">
            Пауза
          </button>

          <button id="sound" onclick="soundVideo()">
            Включить звук
          </button>

          <button id="next" onclick="nextVideo()">
            Вперёд
          </button>
        </div>

      </div>
    </div>

  </section>

  <script src="video-player.js"></script>

</body>

</html>
